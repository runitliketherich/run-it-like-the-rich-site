<aside class="freebie" aria-labelledby="fb-title">
  <p class="eyebrow">Free checklist</p>
  <h3 id="fb-title">{{FB_TITLE}}</h3>
  <p>{{FB_DESC}}</p>
  <ul class="checks small">{{FB_BULLETS}}</ul>
  <form class="fb-form" novalidate data-source="{{FB_TITLE}}">
    <label class="fl" for="fb-email-{{FBID}}">Your email
      <input id="fb-email-{{FBID}}" name="email" type="email" required autocomplete="email" placeholder="you@yourbusiness.com"></label>
    <button class="btn btn-gold" type="submit">Send me the checklist</button>
    <p class="small muted">You'll also get the Run It Like the Rich newsletter. Unsubscribe anytime.</p>
  </form>
  <div class="fb-done" hidden>
    <p><b>You're on the list.</b> Confirm your subscription in the tab that just opened, then start here:</p>
    <a class="btn btn-navy" href="{{FB_LINK}}">Open {{FB_TITLE}}</a>
  </div>
</aside>
