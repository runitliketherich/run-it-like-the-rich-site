  <div class="sec-head"><p class="eyebrow">Owner rules</p><h2>Say them until they stick.</h2></div>
  <div class="grid g3">
    <p class="pull">Data over drama.</p>
    <p class="pull">Process beats panic.</p>
    <p class="pull">Automate the ordinary.</p>
    <p class="pull">Edit the plan, not the mission.</p>
    <p class="pull">Standards build culture.</p>
    <p class="pull">Build it like you could walk away tomorrow.</p>
  </div>
  <div class="row" style="margin-top:28px"><a class="btn btn-navy" data-need="shopUrl" data-fill="shopUrl" href="#" target="_blank" rel="noopener">Shop the motto</a></div>

{{CTA}}

<script>
(function(){
  var f = document.getElementById('sc'); if(!f) return;
  var TIPS = {
    A: 'Your lowest score is Admin. Scattered files and running from memory drag on every day. Start with a Virtual HQ: one folder structure, one password protocol, one place for procedures.',
    B: 'Your lowest score is Books. Without clean, current books you can’t make reliable tax, payroll or draw decisions. Start with a QuickBooks Online review and a reconciliation routine.',
    C: 'Your lowest score is Compliance. Missed sales tax, annual reports or payroll deadlines bring penalties and can suspend your company. Start with one compliance calendar with 30 days’ notice.'
  };
  function upd(){
    var s = {A:0,B:0,C:0}, n = 0;
    f.querySelectorAll('input:checked').forEach(function(i){ s[i.dataset.cat] += +i.value; n++; });
    var t = s.A + s.B + s.C;
    document.getElementById('sc-total').textContent = t;
    ['A','B','C'].forEach(function(k){
      document.getElementById('sc-' + k.toLowerCase()).textContent = s[k] + ' / 15';
      document.getElementById('bar-' + k.toLowerCase()).style.width = (s[k] / 15 * 100) + '%';
    });
    var prof = document.getElementById('sc-prof'), tip = document.getElementById('sc-tip');
    if(n < 9){ prof.textContent = n ? (9 - n) + ' to go. Answer all nine to see your profile.' : 'Answer all nine to see your profile.'; tip.hidden = true; return; }
    prof.innerHTML = t >= 40 ? '<b>The Wealthy Operator.</b> Your back office is disciplined. You run from facts, not guesswork, and you’re built to scale or sell.'
      : t >= 25 ? '<b>The Growing Hustler.</b> Sales are working, but back-office blind spots are quietly leaking profit, time and sanity.'
      : '<b>Administrative Fog.</b> Systems are scattered, books are behind and deadlines are ticking. You’re working too hard in the business to build systems for it.';
    var low = ['A','B','C'].sort(function(a,b){ return s[a] - s[b]; })[0];
    tip.textContent = TIPS[low]; tip.hidden = false;
  }
  f.addEventListener('change', upd); upd();
})();
</script>
